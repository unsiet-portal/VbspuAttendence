<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Schedule - ProAttend</title>
    <style>
        :root {
            --bg-base: #090d16;
            --bg-card: rgba(17, 24, 39, 0.7);
            --border-glow: rgba(99, 102, 241, 0.25);
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(236, 72, 153, 0.12) 0%, transparent 45%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation Bar */
        nav {
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-text {
    font-size: 1.25rem;
    font-weight: 800;
    background: var(--primary-gradient);
    background-clip: text;          /* Yeh line yahan add kar dein */
    -webkit-background-clip: text;  
    -webkit-text-fill-color: transparent;
    text-decoration: none;
}
        .nav-links {
            display: flex;
            gap: 1rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #fff;
            background: rgba(99, 102, 241, 0.15);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
        }

        /* PDF Viewer Container */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .pdf-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h2 {
            color: #fff;
            font-size: 1.3rem;
        }

        .btn-download {
            background: var(--primary-gradient);
            color: white;
            text-decoration: none;
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: 0.3s;
        }

        .btn-download:hover {
            opacity: 0.9;
        }

        iframe {
            width: 100%;
            height: 75vh;
            border: none;
            border-radius: 12px;
            background: #fff;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            margin-top: auto;
            font-size: 0.9rem;
        }
    </style>
</head>
<script type="module" src="script.js"></script>
<body>

    <!-- Navigation Bar -->
    <nav>
        <a href="index.html" class="logo-text">⚡ VbspuAttend [Timetable]</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="attendance.html">Attendance</a></li>
            <li><a href="schedule.html" class="active">Timetable</a></li>
            <li><a href="notices.html">Notices</a></li>
        </ul>
    </nav>

    <!-- PDF Viewer Container -->
    <div class="container">
        <div class="pdf-card">
            <div class="header-row">
                <h2>📅 Official Department Time Table (UNSIET)</h2>
                <a href="timetable.pdf" download class="btn-download">📥 Download PDF</a>
            </div>
            <!-- Embed PDF directly -->
            <iframe src="timetable.pdf"></iframe>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 VbspuAttend Portal. Crafted for Modern Academic Excellence.</p>
    </footer>

</body>
</html>
